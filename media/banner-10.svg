<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <!-- 10: Mar Menor Waves - Subtle wave motif at bottom (lagoon/coastal theme) -->
  <defs>
    <clipPath id="r"><rect width="800" height="200" rx="16"/></clipPath>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/><stop offset="100%" stop-color="#14141f"/>
    </linearGradient>
    <filter id="b1"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <g clip-path="url(#r)">
    <rect width="800" height="200" fill="url(#bg)"/>
    <ellipse cx="150" cy="180" rx="200" ry="120" fill="#AD1519" opacity="0.12" filter="url(#b1)"/>
    <ellipse cx="650" cy="20" rx="200" ry="130" fill="#F1BF00" opacity="0.08" filter="url(#b1)"/>
    <!-- Wave lines at bottom -->
    <path d="M0,175 Q50,165 100,175 T200,175 T300,175 T400,175 T500,175 T600,175 T700,175 T800,175" fill="none" stroke="#1a8a8a" stroke-width="1.5" opacity="0.15"/>
    <path d="M0,182 Q50,172 100,182 T200,182 T300,182 T400,182 T500,182 T600,182 T700,182 T800,182" fill="none" stroke="#1a8a8a" stroke-width="1" opacity="0.1"/>
    <path d="M0,189 Q50,179 100,189 T200,189 T300,189 T400,189 T500,189 T600,189 T700,189 T800,189" fill="none" stroke="#1a8a8a" stroke-width="0.8" opacity="0.07"/>
    <rect width="800" height="2" fill="#AD1519" opacity="0.6"/>
    <text x="400" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="36" fill="#fff" font-weight="700" letter-spacing="1">awesome-region-de-murcia</text>
    <rect x="280" y="83" width="240" height="2" rx="1" fill="#AD1519" opacity="0.5"/>
    <text x="400" y="113" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.5)" font-weight="300" letter-spacing="3">SOFTWARE OPEN SOURCE PARA LA REGION DE MURCIA</text>
    <g opacity="0.4" fill="#F1BF00" transform="translate(400,140)">
      <circle cx="-27" cy="0" r="2.5"/><circle cx="-9" cy="0" r="2.5"/>
      <circle cx="9" cy="0" r="2.5"/><circle cx="27" cy="0" r="2.5"/>
      <circle cx="-18" cy="14" r="2.5"/><circle cx="0" cy="14" r="2.5"/><circle cx="18" cy="14" r="2.5"/>
    </g>
  </g>
</svg>
