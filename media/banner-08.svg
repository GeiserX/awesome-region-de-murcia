<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <!-- 08: Diagonal Carmesi - Bold diagonal stripes in carmesi and gold -->
  <defs>
    <clipPath id="r"><rect width="800" height="200" rx="16"/></clipPath>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/><stop offset="100%" stop-color="#14141f"/>
    </linearGradient>
    <filter id="b1"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <g clip-path="url(#r)">
    <rect width="800" height="200" fill="url(#bg)"/>
    <!-- Diagonal stripes -->
    <line x1="-50" y1="200" x2="150" y2="0" stroke="#AD1519" stroke-width="60" opacity="0.08"/>
    <line x1="50" y1="200" x2="250" y2="0" stroke="#F1BF00" stroke-width="3" opacity="0.08"/>
    <line x1="550" y1="200" x2="750" y2="0" stroke="#AD1519" stroke-width="60" opacity="0.08"/>
    <line x1="650" y1="200" x2="850" y2="0" stroke="#F1BF00" stroke-width="3" opacity="0.08"/>
    <line x1="700" y1="200" x2="900" y2="0" stroke="#AD1519" stroke-width="40" opacity="0.06"/>
    <ellipse cx="400" cy="100" rx="200" ry="100" fill="#AD1519" opacity="0.05" filter="url(#b1)"/>
    <rect width="800" height="2" fill="#AD1519" opacity="0.6"/>
    <text x="400" y="82" text-anchor="middle" font-family="system-ui,sans-serif" font-size="36" fill="#fff" font-weight="700" letter-spacing="1">awesome-region-de-murcia</text>
    <rect x="280" y="93" width="240" height="2" rx="1" fill="#AD1519" opacity="0.5"/>
    <text x="400" y="123" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.5)" font-weight="300" letter-spacing="3">SOFTWARE OPEN SOURCE PARA LA REGION DE MURCIA</text>
    <g opacity="0.4" fill="#F1BF00" transform="translate(400,155)">
      <circle cx="-27" cy="0" r="2.5"/><circle cx="-9" cy="0" r="2.5"/>
      <circle cx="9" cy="0" r="2.5"/><circle cx="27" cy="0" r="2.5"/>
      <circle cx="-18" cy="14" r="2.5"/><circle cx="0" cy="14" r="2.5"/><circle cx="18" cy="14" r="2.5"/>
    </g>
  </g>
</svg>
