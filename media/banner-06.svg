      <rect x="22" y="8" width="6" height="16"/><rect x="0" y="4" width="2" height="4"/>
      <rect x="4" y="4" width="2" height="4"/><rect x="10" y="0" width="3" height="4"/>
      <rect x="15" y="0" width="3" height="4"/><rect x="22" y="4" width="2" height="4"/>
      <rect x="26" y="4" width="2" height="4"/>
