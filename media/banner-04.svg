<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <!-- 04: Carmesi Flood - Full red flag bleeding in from edges -->
  <defs>
    <clipPath id="r"><rect width="800" height="200" rx="16"/></clipPath>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/><stop offset="100%" stop-color="#14141f"/>
    </linearGradient>
    <linearGradient id="fl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AD1519" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#AD1519" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AD1519" stop-opacity="0"/>
      <stop offset="100%" stop-color="#AD1519" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="ft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#AD1519" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#AD1519" stop-opacity="0"/>
    </linearGradient>
    <filter id="b1"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <g clip-path="url(#r)">
    <rect width="800" height="200" fill="url(#bg)"/>
    <rect width="300" height="200" fill="url(#fl)"/>
    <rect x="500" width="300" height="200" fill="url(#fr)"/>
    <rect width="800" height="80" fill="url(#ft)"/>
    <ellipse cx="680" cy="40" rx="200" ry="130" fill="#F1BF00" opacity="0.06" filter="url(#b1)"/>
    <rect width="800" height="3" fill="#AD1519" opacity="0.8"/>
    <rect y="197" width="800" height="3" fill="#AD1519" opacity="0.4"/>
    <text x="400" y="82" text-anchor="middle" font-family="system-ui,sans-serif" font-size="36" fill="#fff" font-weight="700" letter-spacing="1">awesome-region-de-murcia</text>
    <rect x="280" y="93" width="240" height="2" rx="1" fill="#F1BF00" opacity="0.4"/>
    <text x="400" y="123" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.5)" font-weight="300" letter-spacing="3">SOFTWARE OPEN SOURCE PARA LA REGION DE MURCIA</text>
    <g opacity="0.45" fill="#F1BF00" transform="translate(400,155)">
      <circle cx="-27" cy="0" r="2.5"/><circle cx="-9" cy="0" r="2.5"/>
      <circle cx="9" cy="0" r="2.5"/><circle cx="27" cy="0" r="2.5"/>
      <circle cx="-18" cy="14" r="2.5"/><circle cx="0" cy="14" r="2.5"/><circle cx="18" cy="14" r="2.5"/>
    </g>
  </g>
</svg>
